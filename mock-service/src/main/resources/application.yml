spring:
  application:
    name: mock-service
  threads:
    virtual:
      enabled: true

server:
  port: 8081

# Per-instance fault injection. Override with env vars, e.g.
#   MOCK_INSTANCE_ID=image-2 MOCK_LATENCY_MS=50 MOCK_ERROR_RATE=0.1 SERVER_PORT=8082
mock:
  instance-id: mock-${server.port}
  latency-ms: 0
  latency-jitter-ms: 0
  error-rate: 0.0
  error-status: 500
