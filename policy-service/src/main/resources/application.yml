spring:
  application:
    name: policy-service
  threads:
    virtual:
      enabled: true
  # PostgreSQL is the source of truth for rules, tiers and API keys. Flyway creates and upgrades the
  # schema at startup. No password has a default; set POLICY_DB_PASSWORD.
  datasource:
    url: ${POLICY_DB_URL:jdbc:postgresql://localhost:5432/ratelimit}
    username: ${POLICY_DB_USER:ratelimit}
    password: ${POLICY_DB_PASSWORD:}
  jackson:
    deserialization:
      # A misspelled field ("prioritty") must fail loudly instead of silently taking the default.
      fail-on-unknown-properties: true

# Every admin request must send this in X-Admin-Token. No default: set POLICY_ADMIN_TOKEN (16+ characters);
# the service refuses to start without it.
policy:
  admin-token: ${POLICY_ADMIN_TOKEN:}
  # Where the configuration is published for gateways. Empty turns publishing off.
  redis:
    url: ${POLICY_REDIS_URL:redis://localhost:6379}
  publish:
    # How often Redis is checked against the database (changes are also published immediately).
    reconcile-interval: 5s

server:
  port: 8090
