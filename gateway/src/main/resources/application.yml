spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true

server:
  port: 8080

gateway:
  # With Redis configured: once at least failure-rate-threshold percent of the latest `window` Redis calls have
  # failed (a call fails after gateway.redis.command-timeout), the gateway stops calling Redis for open-for, then
  # lets `probes` calls through to decide whether to resume.
  redis:
    breaker:
      window: 20
      failure-rate-threshold: 50
      open-for: 5s
      probes: 3

  # With Redis configured, each gateway reports itself this often; those heard from within node-timeout count
  # as running, which sets each one's share of a LOCAL_SYNC bucket. Give every gateway the same values.
  cluster:
    heartbeat-interval: 1s
    node-timeout: 3s

  # How LOCAL_SYNC rules borrow tokens from Redis. A batch is the tokens a key is expected to need over one
  # horizon (never fewer than min-batch) and may be spent for two horizons. The next batch is fetched in the
  # background once fewer than refill-below of the last one is left (0 turns that off). A longer horizon means
  # fewer Redis calls, but more tokens held by one gateway where the others cannot use them.
  lease:
    min-batch: 1
    horizon: 1s
    refill-below: 0.3

  # IPs / CIDRs of reverse proxies whose X-Forwarded-For is trusted (e.g. the nginx container).
  # Empty = trust nobody, use the socket address. Override: GATEWAY_TRUSTED_PROXIES=172.18.0.0/16
  trusted-proxies: []

  # Static rate-limit rules, same shape as the ratelimit_rules table. Anything not matched here falls
  # to the built-in per-stage defaults (default-ip, default-user), so nothing is ever unlimited.
  ratelimit:
    # With Redis configured, published rules replace the ones below; each applied snapshot is saved here so
    # the gateway can start with it while Redis is down. Gateways on one machine need different files.
    snapshot-file: data/rules-snapshot.json
    # A running gateway reloads when the policy service announces a change, and also re-reads the published
    # rules this often in case an announcement was lost.
    subscribe-to-updates: true
    update-poll-interval: 10s
    rules:
      - id: 1
        name: free-images
        limit-by: USER
        match-tier: free
        endpoint-pattern: /api/images/**
        algorithm: TOKEN_BUCKET
        params: { capacity: 10, refill-per-sec: 1 }
      - id: 2
        name: pro-images
        limit-by: USER
        match-tier: pro
        endpoint-pattern: /api/images/**
        algorithm: TOKEN_BUCKET
        params: { capacity: 100, refill-per-sec: 20 }
      - id: 3
        name: text-generation
        limit-by: USER
        endpoint-pattern: /api/text/**
        algorithm: TOKEN_BUCKET
        params: { capacity: 30, refill-per-sec: 5 }

  # Where requests go. The path is forwarded unchanged. Defaults suit running the mock services locally:
  #   MOCK_INSTANCE_ID=image-1 SERVER_PORT=8081 ..., image-2 on 8082, text-1 on 8083.
  # The read timeout must exceed the longest leaky-bucket wait of any rule, and a load balancer in
  # front of the gateway must time out later than this.
  proxy:
    connect-timeout: 1s
    read-timeout: 10s
    ejection:
      failure-threshold: 3
      cooldown: 10s
    routes:
      - pattern: /api/images/**
        service: image-service
        instances:
          - http://localhost:8081
          - http://localhost:8082
      - pattern: /api/text/**
        service: text-service
        instances:
          - http://localhost:8083

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
